name: Flutter CI

on:
  pull_request:
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-ci.yml"

  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
    paths:
      - "flutter-app/**"
      - ".github/workflows/flutter-ci.yml"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    env:
      TZ: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: flutter-app/pubspec.yaml
          channel: stable
          cache: true

      - name: Flutter version
        working-directory: flutter-app
        run: flutter --version

      - name: Get dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze

      - name: Test
        working-directory: flutter-app
        run: flutter test

      - name: Build APK
        working-directory: flutter-app
        run: flutter build apk --release

  authenticate-google:
    if: github.event_name == 'push'
    needs: analyze-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/658602031061/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "github-actions-firebase@besser-bahn.iam.gserviceaccount.com"