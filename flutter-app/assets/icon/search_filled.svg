<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Filled magnifier: a solid lens + handle, so the Suche nav tab reads as
       "filled" when active (Material has no filled search glyph). Recoloured at
       runtime via a ColorFilter, so the fill/stroke colour here is a placeholder. -->
