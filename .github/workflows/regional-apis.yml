name: Regionale APIs

# Once a day, hit every regional transport backend the app relies on (23 Verbünde
# across HAFAS + EFA, plus HVV Geofox) and fail loudly if the majority stopped
# answering or dropped the planned/live platform fields — the two ways the app
# silently goes blind. A failing run opens a GitHub issue (and closes it again on
# recovery), so it lands in notifications the moment something breaks rather than
# being noticed weeks later by a confused rider.

on:
  schedule:
    # 05:14 UTC — off the top of the hour, so we don't queue behind everyone
    # else's on-the-hour cron, and early enough to see it over morning coffee.
    - cron: "14 5 * * *"
  workflow_dispatch: {} # let it be triggered by hand from the Actions tab

permissions:
  contents: read
  issues: write # the failure notification is a GitHub issue

concurrency:
  group: regional-apis
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests curl_cffi pytest

      - name: Probe regional backends
        id: probe
        working-directory: api-tests
        run: |
          set +e
          # -rN so skips (a single dead backend) are visible but not fatal;
          # the suite only fails on the majority-down / field-gone asserts.
          python -m pytest test_regional_apis.py -v -rN \
            > result.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # Tail into the step summary so a green run is readable without
          # digging into logs, and the issue body has something to quote.
          {
            echo '```'
            tail -n 40 result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat result.txt
          exit 0

      - name: Open an issue on failure
        if: steps.probe.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tail = fs.readFileSync('api-tests/result.txt', 'utf8')
              .split('\n').slice(-40).join('\n');
            const marker = '<!-- regional-apis-monitor -->';
            const body = [
              marker,
              'Der tägliche Lauf gegen die regionalen Verkehrs-APIs ist **fehlgeschlagen**.',
              'Das heißt in der Regel: ein Backend hat sein Protokoll geändert, oder die',
              'Mehrheit eines Systems (HAFAS / EFA) ist nicht erreichbar — dann liefert die',
              'App dort keine Steig-/Gleiskorrektur mehr.',
              '',
              `Lauf: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```',
              tail,
              '```',
            ].join('\n');

            // Reuse one open issue instead of spamming a new one each day.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'regional-apis',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Regionale APIs: täglicher Test fehlgeschlagen',
                labels: ['regional-apis'], body,
              });
            }

      - name: Close the issue on recovery
        if: steps.probe.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'regional-apis',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: 'Wieder grün ✅ — automatisch geschlossen.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
            }

      - name: Fail the job if the probe failed
        if: steps.probe.outputs.exit_code != '0'
        run: exit 1
